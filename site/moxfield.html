<!doctype html>
<html>
  <head>
    <title>Playtest Printer</title>
    <meta property="og:title" content="Playtest Printer" />
    <meta
      property="og:description"
      content="Print images into 2.5x3.5in cards for playtesting"
    />
    <meta property="og:url" content="https://playtest.hamatti.org" />

    <style>
      @media print {
        .no-print {
          display: none !important;
        }
      }

      .options {
        max-width: 100vw;
        padding: 0.5em;
        display: flex;
        justify-content: space-between;
        border-bottom: 1px solid #d3d3d3;
      }

      button {
        background: transparent;
        border: 1px solid black;
        border-radius: 5px;
        color: black;
        margin-right: 20px;
      }

      button#overlay {
        border: none;
      }

      div#help-text {
        padding: 1em;
        border-bottom: 1px solid black;

        & h1 {
          margin-top: 0;
        }

        & hr {
          width: 50%;
          margin: auto;
          color: #d3d3d3;
        }
      }

      div#help-text.closed {
        display: none;
      }

      div#drop-zone {
        /* positions to point 0,0 - required for z-index */
        position: fixed;
        top: 0;
        left: 0;
        /* above all elements, even if z-index is used elsewhere
      	it can be lowered as needed, but this value surpasses
      	all elements when used on YouTube for example. */
        z-index: 9999999999;
        /* takes up 100% of page */
        width: 100%;
        height: 100%;
        /* dim the page with 50% black background when visible */
        background-color: rgba(0, 0, 0, 0.2);
        /* a nice fade effect, visibility toggles after 175ms, opacity will animate for 175ms. note display:none cannot be animated.  */
        transition:
          visibility 175ms,
          opacity 175ms;
      }

      main {
        flex: 1 1 100%;
        width: 100%;
        padding: 2em;
      }

      aside {
        display: none;
        padding-top: 1em;
        border-left: 1px dashed #d3d3d3;
        height: 100vh;
        padding-left: 1em;
      }
      #search-overlay {
        width: 500px;
        flex-basis: 0;
      }

      aside.visible {
        flex-basis: 500px;
        flex-grow: 1;
        display: block;
      }

      .card-listing {
        display: flex;
        flex-wrap: wrap;
        list-style: none;

        & img {
          max-width: 150px;
          max-height: 210px;
        }
      }

      .lower {
        display: flex;
        flex-direction: row;
      }
      .search-options {
        margin-bottom: 0.5em;
      }

      #moxfield-bulk {
        margin-bottom: 2em;
      }
    </style>

    <link rel="stylesheet" href="card-print.css" />
  </head>

  <body>
    <main>
      <div class="no-print">
        <h2>Experimental Bulk import from Moxfield</h2>
        <form id="moxfield-bulk">
          <textarea name="moxfield" rows="20" cols="60"></textarea>
          <button id="import-bulk" type="submit">Import</button>
        </form>
      </div>
      <div id="proxy-zone"></div>
    </main>

    <script src="bulk-import.js"></script>
    <script src="search.js"></script>
  </body>
</html>
